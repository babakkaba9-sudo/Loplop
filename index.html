<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عکس‌های یادگاری رضا تاج و بابک</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&family=Amiri:wght@700&family=Lalezar&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    font-family: 'Vazirmatn', Tahoma, sans-serif;
    background: #08080c;
    color: #fff;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ===== پس‌زمینه کهکشانی ===== */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: 
      radial-gradient(ellipse at 20% 10%, rgba(102, 126, 234, 0.15), transparent 50%),
      radial-gradient(ellipse at 80% 80%, rgba(240, 147, 251, 0.12), transparent 50%),
      radial-gradient(ellipse at 50% 50%, rgba(79, 172, 254, 0.08), transparent 60%);
    z-index: -2;
    pointer-events: none;
  }
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image: 
      radial-gradient(2px 2px at 15% 25%, #fff, transparent),
      radial-gradient(2px 2px at 65% 75%, #c4b5fd, transparent),
      radial-gradient(1px 1px at 45% 55%, #fff, transparent),
      radial-gradient(1px 1px at 85% 15%, #fcd34d, transparent),
      radial-gradient(2px 2px at 92% 65%, #fff, transparent),
      radial-gradient(1px 1px at 35% 85%, #a5b4fc, transparent),
      radial-gradient(1px 1px at 5% 90%, #fff, transparent),
      radial-gradient(2px 2px at 75% 35%, #fff, transparent);
    background-size: 200% 200%;
    animation: stars 80s linear infinite;
    opacity: 0.6;
    z-index: -1;
    pointer-events: none;
  }
  @keyframes stars {
    0% { background-position: 0 0; }
    100% { background-position: 200% 200%; }
  }

  /* ===== هدر ===== */
  header {
    position: relative;
    padding: 60px 20px 50px;
    text-align: center;
    background: linear-gradient(180deg, rgba(102, 126, 234, 0.25) 0%, rgba(118, 75, 162, 0.15) 50%, transparent 100%);
    overflow: hidden;
    z-index: 10;
  }
  header::before {
    content: '';
    position: absolute;
    top: -50%;
    left: 50%;
    transform: translateX(-50%);
    width: 800px;
    height: 800px;
    background: radial-gradient(circle, rgba(102, 126, 234, 0.4) 0%, transparent 70%);
    animation: glow 6s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes glow {
    0%, 100% { opacity: 0.6; transform: translateX(-50%) scale(1); }
    50% { opacity: 1; transform: translateX(-50%) scale(1.15); }
  }

  header h1 {
    position: relative;
    font-family: 'Lalezar', 'Vazirmatn', sans-serif;
    font-size: 2.8rem;
    font-weight: 400;
    margin-bottom: 15px;
    background: linear-gradient(135deg, #fff 0%, #a5b4fc 40%, #f0abfc 70%, #fcd34d 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 40px rgba(165, 180, 252, 0.5);
    animation: float 4s ease-in-out infinite;
    letter-spacing: 1px;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }

  /* ===== شعر ===== */
  .poem {
    position: relative;
    max-width: 700px;
    margin: 25px auto 30px;
    padding: 25px 20px;
    font-family: 'Amiri', 'Vazirmatn', serif;
    font-size: 1.35rem;
    font-weight: 700;
    line-height: 2.2;
    color: #e0e7ff;
    text-align: center;
    direction: rtl;
  }
  .poem::before,
  .poem::after {
    content: '❝';
    position: absolute;
    font-size: 3rem;
    color: rgba(165, 180, 252, 0.4);
    font-family: serif;
  }
  .poem::before {
    top: -5px;
    right: -10px;
  }
  .poem::after {
    content: '❞';
    bottom: -20px;
    left: -10px;
  }
  .poem .line {
    display: block;
    opacity: 0;
    animation: fadeInPoem 1s forwards;
    text-shadow: 0 0 25px rgba(165, 180, 252, 0.4);
  }
  .poem .line:nth-child(1) { animation-delay: 0.2s; }
  .poem .line:nth-child(2) { animation-delay: 0.7s; }
  @keyframes fadeInPoem {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
  }

  header .subtitle {
    position: relative;
    display: inline-block;
    font-size: 1.05rem;
    font-weight: 700;
    color: #c4b5fd;
    padding: 8px 25px;
    border: 2px solid rgba(196, 181, 253, 0.4);
    border-radius: 50px;
    background: rgba(102, 126, 234, 0.1);
    backdrop-filter: blur(10px);
    letter-spacing: 1px;
  }

  /* ===== پلیر آهنگ ===== */
  .music-player {
    max-width: 640px;
    margin: 40px auto 20px;
    padding: 22px 28px;
    background: linear-gradient(135deg, rgba(26, 26, 46, 0.9), rgba(22, 33, 62, 0.9));
    border-radius: 24px;
    display: flex;
    align-items: center;
    gap: 18px;
    flex-wrap: wrap;
    box-shadow: 
      0 15px 50px rgba(102, 126, 234, 0.4),
      inset 0 1px 0 rgba(255, 255, 255, 0.15),
      inset 0 -1px 0 rgba(0, 0, 0, 0.3);
    position: relative;
    backdrop-filter: blur(20px);
  }
  .music-player::before {
    content: '';
    position: absolute;
    inset: -2px;
    padding: 2px;
    border-radius: 24px;
    background: linear-gradient(135deg, #667eea, #f093fb, #4facfe, #667eea);
    background-size: 300% 300%;
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    animation: borderShift 4s linear infinite;
    pointer-events: none;
  }
  @keyframes borderShift {
    0% { background-position: 0% 50%; }
    100% { background-position: 300% 50%; }
  }
  .music-icon {
    font-size: 2.2rem;
    animation: rotateMusic 3s linear infinite;
    filter: drop-shadow(0 0 15px rgba(102, 126, 234, 1));
  }
  @keyframes rotateMusic {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  .music-info {
    flex: 1;
    min-width: 150px;
  }
  .music-title {
    font-size: 1rem;
    font-weight: 700;
    color: #fff;
    margin-bottom: 5px;
  }
  .music-player audio {
    width: 100%;
    margin-top: 8px;
    border-radius: 30px;
    outline: none;
    filter: hue-rotate(220deg) saturate(1.5);
  }

  /* ===== گالری ===== */
  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 22px;
    max-width: 1200px;
    margin: 0 auto;
    padding: 30px 20px 40px;
  }
  .photo-card {
    position: relative;
    overflow: hidden;
    border-radius: 18px;
    cursor: pointer;
    background: #1a1a22;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
    transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275),
                box-shadow 0.4s;
    opacity: 0;
    transform: translateY(30px);
    animation: fadeInUp 0.6s forwards;
  }
  @keyframes fadeInUp {
    to { opacity: 1; transform: translateY(0); }
  }
  .photo-card:hover {
    transform: translateY(-8px) scale(1.02);
    box-shadow: 0 20px 50px rgba(102, 126, 234, 0.6);
  }
  .photo-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, transparent 40%, rgba(165, 180, 252, 0.15) 100%);
    z-index: 2;
    opacity: 0;
    transition: opacity 0.4s;
    pointer-events: none;
  }
  .photo-card:hover::before { opacity: 1; }
  .photo-card::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 18px;
    box-shadow: inset 0 0 0 2px rgba(165, 180, 252, 0);
    transition: box-shadow 0.4s;
    pointer-events: none;
    z-index: 3;
  }
  .photo-card:hover::after {
    box-shadow: inset 0 0 0 2px rgba(165, 180, 252, 0.8);
  }
  .photo-card img {
    width: 100%;
    height: 280px;
    object-fit: cover;
    display: block;
    transition: transform 0.6s, filter 0.4s;
    filter: saturate(0.85);
  }
  .photo-card:hover img {
    transform: scale(1.12);
    filter: saturate(1.3) brightness(1.05);
  }

  /* ===== اطلاعات عکس (ساده و شیک) ===== */
  .photo-info {
    padding: 12px 15px;
    background: linear-gradient(to top, #1a1a22, #1e1e28);
    border-top: 1px solid #2a2a33;
    position: relative;
    z-index: 1;
    text-align: center;
  }
  .photo-info .title {
    font-size: 0.95rem;
    font-weight: 700;
    letter-spacing: 0.5px;
    background: linear-gradient(135deg, #e0e7ff, #c4b5fd, #a5b4fc);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .photo-info .title::before {
    content: '📷 ';
    -webkit-text-fill-color: initial;
    background: none;
  }

  /* ===== Lightbox ===== */
  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.96);
    backdrop-filter: blur(15px);
    z-index: 1000;
    justify-content: center;
    align-items: center;
    padding: 20px;
    animation: fadeIn 0.3s;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .lightbox.active { display: flex; }
  .lightbox .lb-content {
    max-width: 90%;
    max-height: 90vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    animation: zoomIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  @keyframes zoomIn {
    from { opacity: 0; transform: scale(0.7); }
    to { opacity: 1; transform: scale(1); }
  }
  .lightbox img {
    max-width: 100%;
    max-height: 75vh;
    border-radius: 15px;
    box-shadow: 0 0 80px rgba(102, 126, 234, 0.6);
  }
  .lightbox .lb-caption {
    margin-top: 20px;
    text-align: center;
    color: #fff;
  }
  .lightbox .lb-caption .lb-title {
    font-size: 1.2rem;
    font-weight: 700;
    margin-bottom: 8px;
    background: linear-gradient(135deg, #e0e7ff, #c4b5fd);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .lightbox .close {
    position: absolute;
    top: 20px; right: 25px;
    font-size: 2rem;
    color: #fff;
    cursor: pointer;
    background: rgba(255, 255, 255, 0.1);
    border: 2px solid rgba(255, 255, 255, 0.3);
    width: 50px; height: 50px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: 0.3s;
  }
  .lightbox .close:hover {
    background: #ff6b6b;
    transform: rotate(90deg);
  }
  .lightbox .nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    font-size: 2.5rem;
    color: #fff;
    background: rgba(255, 255, 255, 0.15);
    border: 2px solid rgba(255, 255, 255, 0.3);
    width: 60px; height: 60px;
    border-radius: 50%;
    cursor: pointer;
    transition: 0.3s;
    backdrop-filter: blur(10px);
  }
  .lightbox .nav:hover {
    background: #667eea;
    transform: translateY(-50%) scale(1.15);
  }
  .lightbox .prev { left: 20px; }
  .lightbox .next { right: 20px; }

  /* ===== Empty ===== */
  .empty {
    text-align: center;
    padding: 60px 20px;
    color: #888;
    grid-column: 1 / -1;
  }
  .empty h3 { font-size: 1.5rem; margin-bottom: 10px; }

  /* ===== Footer ===== */
  footer {
    text-align: center;
    padding: 40px 20px 30px;
    color: #666;
    font-size: 0.9rem;
    position: relative;
  }
  footer::before {
    content: '';
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 200px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(165, 180, 252, 0.5), transparent);
  }
  footer .heart {
    display: inline-block;
    color: #ff6b9d;
    animation: heartBeat 1.5s ease-in-out infinite;
  }
  @keyframes heartBeat {
    0%, 100% { transform: scale(1); }
    25% { transform: scale(1.2); }
    50% { transform: scale(1); }
  }

  /* ===== دکمه برو بالا ===== */
  .back-to-top {
    position: fixed;
    bottom: 30px;
    left: 25px;
    width: 52px; height: 52px;
    border-radius: 50%;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff;
    border: none;
    font-size: 1.5rem;
    cursor: pointer;
    box-shadow: 0 6px 25px rgba(102, 126, 234, 0.7);
    opacity: 0;
    transform: translateY(20px);
    transition: all 0.4s;
    pointer-events: none;
    z-index: 99;
  }
  .back-to-top.show {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }
  .back-to-top:hover {
    transform: translateY(-5px) scale(1.1);
    box-shadow: 0 10px 35px rgba(102, 126, 234, 1);
  }

  /* ===== موبایل ===== */
  @media (max-width: 600px) {
    header { padding: 40px 15px 30px; }
    header h1 { font-size: 2rem; }
    .poem { 
      font-size: 1.1rem; 
      line-height: 2;
      padding: 20px 15px;
    }
    .poem::before,
    .poem::after { font-size: 2rem; }
    header .subtitle { font-size: 0.9rem; padding: 6px 18px; }
    .gallery {
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 15px;
    }
    .photo-card img { height: 220px; }
    .lightbox .nav { width: 45px; height: 45px; font-size: 1.8rem; }
    .lightbox .close { width: 42px; height: 42px; font-size: 1.8rem; }
    .music-player {
      margin: 25px 12px;
      padding: 16px;
    }
    .music-icon { font-size: 1.8rem; }
    .back-to-top { bottom: 20px; left: 20px; width: 45px; height: 45px; }
  }
</style>
</head>
<body>

<header>
  <h1>📸 عکس‌های یادگاری</h1>
  
  <div class="poem">
    <span class="line">ای دوست بیا تا غم فردا مخوریم</span>
    <span class="line">این یک دم عمر را غنیمت شمریم</span>
  </div>
  
  <div class="subtitle">رضا تاج و بابک</div>
</header>

<!-- ===== پلیر آهنگ ===== -->
<div class="music-player">
  <div class="music-icon">🎵</div>
  <div class="music-info">
    <div class="music-title">مصطفی ابراهیمی - مثل تمام عالم</div>
  </div>
  <audio id="myAudio" controls>
    <source src="song1.mp3" type="audio/mpeg">
    مرورگر شما از پخش صدا پشتیبانی نمی‌کند.
  </audio>
</div>

<div class="gallery" id="gallery">
  <div class="empty">
    <h3>در حال بارگذاری...</h3>
  </div>
</div>

<footer>
  ساخته‌شده با <span class="heart">❤️</span> برای رضا تاج و بابک
</footer>

<button class="back-to-top" id="backToTop">↑</button>

<div class="lightbox" id="lightbox">
  <button class="close" id="closeLb">×</button>
  <button class="nav prev" id="prevBtn">‹</button>
  <div class="lb-content">
    <img id="lbImg" src="" alt="">
    <div class="lb-caption">
      <div class="lb-title" id="lbTitle"></div>
    </div>
  </div>
  <button class="nav next" id="nextBtn">›</button>
</div>

<script>
const PHOTOS = [
  { file: '2.jpg', title: 'عکس یادگاری' },
  { file: '3.jpg', title: 'عکس یادگاری' },
  { file: '4.jpg', title: 'عکس یادگاری' },
  { file: '6.jpg', title: 'عکس یادگاری' },
  { file: '7.jpg', title: 'عکس یادگاری' },
  { file: '8.jpg', title: 'عکس یادگاری' },
  { file: '27.jpg', title: 'عکس یادگاری' },
  { file: '49.jpg', title: 'عکس یادگاری' },
];

const BASE_URL = 'https://babakkaba9-sudo.github.io/Loplop/';

let photos = [];
let lbIndex = 0;

const gallery = document.getElementById('gallery');
const lightbox = document.getElementById('lightbox');
const lbImg = document.getElementById('lbImg');
const lbTitle = document.getElementById('lbTitle');

function loadPhotos() {
  photos = PHOTOS.map((p, i) => ({
    id: i,
    url: BASE_URL + p.file,
    title: p.title
  }));
  render();
}

function render() {
  gallery.innerHTML = '';
  photos.forEach((p, idx) => {
    const card = document.createElement('div');
    card.className = 'photo-card';
    card.style.animationDelay = (idx * 0.08) + 's';
    card.innerHTML = `
      <img src="${p.url}" alt="${p.title}" loading="lazy">
      <div class="photo-info">
        <div class="title">${p.title}</div>
      </div>
    `;
    card.onclick = () => openLightbox(p.id);
    gallery.appendChild(card);
  });
}

function openLightbox(id) {
  lbIndex = photos.findIndex(p => p.id === id);
  if (lbIndex < 0) return;
  const p = photos[lbIndex];
  lbImg.src = p.url;
  lbTitle.textContent = p.title;
  lightbox.classList.add('active');
}
function closeLightbox() { lightbox.classList.remove('active'); }
function navLightbox(dir) {
  lbIndex = (lbIndex + dir + photos.length) % photos.length;
  const p = photos[lbIndex];
  lbImg.src = p.url;
  lbTitle.textContent = p.title;
}
document.getElementById('closeLb').onclick = closeLightbox;
document.getElementById('prevBtn').onclick = () => navLightbox(-1);
document.getElementById('nextBtn').onclick = () => navLightbox(1);
lightbox.onclick = e => { if (e.target === lightbox) closeLightbox(); };

document.addEventListener('keydown', e => {
  if (!lightbox.classList.contains('active')) return;
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowRight') navLightbox(-1);
  if (e.key === 'ArrowLeft') navLightbox(1);
});

const backToTop = document.getElementById('backToTop');
window.addEventListener('scroll', () => {
  if (window.scrollY > 300) {
    backToTop.classList.add('show');
  } else {
    backToTop.classList.remove('show');
  }
});
backToTop.onclick = () => {
  window.scrollTo({ top: 0, behavior: 'smooth' });
};

loadPhotos();
</script>
</body>
</html>
