<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عکس‌های یادگاری رضا تاج و بابک</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    font-family: 'Vazirmatn', Tahoma, sans-serif;
    background: #0f0f13;
    color: #fff;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ===== پس‌زمینه ستاره‌باران ===== */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: 
      radial-gradient(2px 2px at 20% 30%, #fff, transparent),
      radial-gradient(2px 2px at 60% 70%, #a8b3ff, transparent),
      radial-gradient(1px 1px at 50% 50%, #fff, transparent),
      radial-gradient(1px 1px at 80% 10%, #ffd966, transparent),
      radial-gradient(2px 2px at 90% 60%, #fff, transparent),
      radial-gradient(1px 1px at 33% 80%, #a8b3ff, transparent);
    background-size: 200% 200%;
    animation: stars 60s linear infinite;
    opacity: 0.5;
    z-index: -1;
    pointer-events: none;
  }
  @keyframes stars {
    0% { background-position: 0 0; }
    100% { background-position: 200% 200%; }
  }

  /* ===== هدر ===== */
  header {
    background: linear-gradient(-45deg, #667eea, #764ba2, #f093fb, #4facfe);
    background-size: 400% 400%;
    animation: gradientShift 12s ease infinite;
    padding: 35px 20px 30px;
    text-align: center;
    box-shadow: 0 4px 30px rgba(102, 126, 234, 0.4);
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(10px);
  }
  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  header h1 { 
    font-size: 2rem; 
    margin-bottom: 8px;
    font-weight: 900;
    text-shadow: 0 2px 15px rgba(0,0,0,0.4);
    animation: float 3s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
  }
  header .subtitle {
    font-size: 1rem;
    opacity: 0.95;
    margin-top: 5px;
    font-weight: 700;
  }
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    align-items: center;
    max-width: 1200px;
    margin: 20px auto 0;
  }
  .toolbar input[type="text"] {
    padding: 12px 20px;
    border-radius: 25px;
    border: 2px solid rgba(255,255,255,0.3);
    outline: none;
    font-family: inherit;
    width: 260px;
    background: rgba(255,255,255,0.95);
    color: #333;
    font-size: 0.95rem;
    transition: all 0.3s;
  }
  .toolbar input[type="text"]:focus {
    border-color: #fff;
    box-shadow: 0 0 20px rgba(255,255,255,0.5);
    transform: scale(1.03);
  }

  /* ===== پلیر آهنگ ===== */
  .music-player {
    max-width: 620px;
    margin: 30px auto 10px;
    padding: 20px 25px;
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    border: 2px solid transparent;
    background-clip: padding-box;
    border-radius: 20px;
    display: flex;
    align-items: center;
    gap: 15px;
    flex-wrap: wrap;
    box-shadow: 0 8px 30px rgba(102, 126, 234, 0.35), 
                inset 0 1px 0 rgba(255,255,255,0.1);
    position: relative;
    overflow: hidden;
  }
  .music-player::before {
    content: '';
    position: absolute;
    inset: 0;
    padding: 2px;
    border-radius: 20px;
    background: linear-gradient(135deg, #667eea, #f093fb, #4facfe);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    animation: borderShift 4s linear infinite;
    background-size: 300% 300%;
    pointer-events: none;
  }
  @keyframes borderShift {
    0% { background-position: 0% 50%; }
    100% { background-position: 300% 50%; }
  }
  .music-icon {
    font-size: 2rem;
    animation: rotateMusic 2s linear infinite;
    filter: drop-shadow(0 0 10px rgba(102, 126, 234, 0.8));
  }
  @keyframes rotateMusic {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  .music-info {
    flex: 1;
    min-width: 150px;
  }
  .music-title {
    font-size: 1rem;
    font-weight: 700;
    color: #fff;
    margin-bottom: 5px;
  }
  .music-player audio {
    width: 100%;
    margin-top: 8px;
    border-radius: 30px;
    outline: none;
    filter: hue-rotate(220deg) saturate(1.5);
  }

  /* ===== گالری ===== */
  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 22px;
    max-width: 1200px;
    margin: 0 auto;
    padding: 30px 20px 40px;
  }
  .photo-card {
    position: relative;
    overflow: hidden;
    border-radius: 18px;
    cursor: pointer;
    background: #1a1a22;
    box-shadow: 0 6px 20px rgba(0,0,0,0.5);
    transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), 
                box-shadow 0.4s;
    opacity: 0;
    transform: translateY(30px);
    animation: fadeInUp 0.6s forwards;
  }
  @keyframes fadeInUp {
    to { opacity: 1; transform: translateY(0); }
  }
  .photo-card:hover {
    transform: translateY(-8px) scale(1.02);
    box-shadow: 0 15px 40px rgba(102, 126, 234, 0.5);
  }
  .photo-card::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 18px;
    box-shadow: inset 0 0 0 2px rgba(255,255,255,0);
    transition: box-shadow 0.4s;
    pointer-events: none;
  }
  .photo-card:hover::after {
    box-shadow: inset 0 0 0 2px rgba(102, 126, 234, 0.8);
  }
  .photo-card img {
    width: 100%;
    height: 280px;
    object-fit: cover;
    display: block;
    transition: transform 0.6s, filter 0.4s;
    filter: saturate(0.85);
  }
  .photo-card:hover img {
    transform: scale(1.12);
    filter: saturate(1.3) brightness(1.05);
  }
  .photo-info {
    padding: 15px 15px 18px;
    background: linear-gradient(to top, #1a1a22, #1e1e28);
    border-top: 1px solid #2a2a33;
    position: relative;
    z-index: 1;
  }
  .photo-info .title {
    font-size: 1rem;
    font-weight: 700;
    margin-bottom: 8px;
    color: #fff;
  }
  .photo-info .desc {
    font-size: 0.9rem;
    color: #aaa;
    line-height: 1.6;
  }
  .photo-info .desc .heart {
    color: #ff6b9d;
    display: inline-block;
    animation: heartBeat 1.5s ease-in-out infinite;
  }
  @keyframes heartBeat {
    0%, 100% { transform: scale(1); }
    25% { transform: scale(1.2); }
    50% { transform: scale(1); }
  }

  /* ===== Lightbox ===== */
  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.95);
    backdrop-filter: blur(15px);
    z-index: 1000;
    justify-content: center;
    align-items: center;
    padding: 20px;
    animation: fadeIn 0.3s;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .lightbox.active { display: flex; }
  .lightbox .lb-content {
    max-width: 90%;
    max-height: 90vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    animation: zoomIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  @keyframes zoomIn {
    from { opacity: 0; transform: scale(0.7); }
    to { opacity: 1; transform: scale(1); }
  }
  .lightbox img {
    max-width: 100%;
    max-height: 75vh;
    border-radius: 15px;
    box-shadow: 0 0 60px rgba(102, 126, 234, 0.5);
  }
  .lightbox .lb-caption {
    margin-top: 20px;
    text-align: center;
    color: #fff;
  }
  .lightbox .lb-caption .lb-title {
    font-size: 1.2rem;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .lightbox .lb-caption .lb-desc {
    font-size: 0.95rem;
    color: #bbb;
  }
  .lightbox .close {
    position: absolute;
    top: 20px; right: 25px;
    font-size: 2.5rem;
    color: #fff;
    cursor: pointer;
    background: rgba(255,255,255,0.1);
    border: 2px solid rgba(255,255,255,0.3);
    width: 50px; height: 50px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: 0.3s;
  }
  .lightbox .close:hover {
    background: #ff6b6b;
    transform: rotate(90deg);
  }
  .lightbox .nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    font-size: 2.5rem;
    color: #fff;
    background: rgba(255,255,255,0.15);
    border: 2px solid rgba(255,255,255,0.3);
    width: 60px; height: 60px;
    border-radius: 50%;
    cursor: pointer;
    transition: 0.3s;
    backdrop-filter: blur(10px);
  }
  .lightbox .nav:hover {
    background: #667eea;
    transform: translateY(-50%) scale(1.15);
  }
  .lightbox .prev { left: 20px; }
  .lightbox .next { right: 20px; }

  /* ===== Empty ===== */
  .empty {
    text-align: center;
    padding: 60px 20px;
    color: #888;
    grid-column: 1 / -1;
  }
  .empty h3 { font-size: 1.5rem; margin-bottom: 10px; }

  /* ===== Footer ===== */
  footer {
    text-align: center;
    padding: 25px;
    color: #666;
    font-size: 0.9rem;
  }
  footer .heart {
    display: inline-block;
    color: #ff6b9d;
    animation: heartBeat 1.5s ease-in-out infinite;
  }

  /* ===== دکمه برو بالا ===== */
  .back-to-top {
    position: fixed;
    bottom: 30px;
    left: 25px;
    width: 50px; height: 50px;
    border-radius: 50%;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff;
    border: none;
    font-size: 1.5rem;
    cursor: pointer;
    box-shadow: 0 6px 25px rgba(102, 126, 234, 0.6);
    opacity: 0;
    transform: translateY(20px);
    transition: all 0.4s;
    pointer-events: none;
    z-index: 99;
  }
  .back-to-top.show {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }
  .back-to-top:hover {
    transform: translateY(-5px) scale(1.1);
    box-shadow: 0 10px 35px rgba(102, 126, 234, 0.9);
  }

  /* ===== موبایل ===== */
  @media (max-width: 600px) {
    header h1 { font-size: 1.4rem; }
    .toolbar input[type="text"] { width: 100%; }
    .gallery { 
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 15px;
    }
    .photo-card img { height: 220px; }
    .lightbox .nav { width: 45px; height: 45px; font-size: 1.8rem; }
    .lightbox .close { width: 42px; height: 42px; font-size: 2rem; }
    .music-player {
      margin: 20px 12px;
      padding: 16px;
    }
    .music-icon { font-size: 1.6rem; }
    .back-to-top { bottom: 20px; left: 20px; width: 45px; height: 45px; }
  }
</style>
</head>
<body>

<header>
  <h1>📸 عکس‌های یادگاری</h1>
  <div class="subtitle">رضا تاج و بابک</div>
  <div class="toolbar">
    <input type="text" id="searchBox" placeholder="🔍 جستجو در توضیحات...">
  </div>
</header>

<!-- ===== پلیر آهنگ ===== -->
<div class="music-player">
  <div class="music-icon">🎵</div>
  <div class="music-info">
    <div class="music-title">مصطفی ابراهیمی - مثل تمام عالم</div>
  </div>
  <audio id="myAudio" controls>
    <source src="song1.mp3" type="audio/mpeg">
    مرورگر شما از پخش صدا پشتیبانی نمی‌کند.
  </audio>
</div>

<div class="gallery" id="gallery">
  <div class="empty">
    <h3>در حال بارگذاری...</h3>
  </div>
</div>

<footer>
  ساخته‌شده با <span class="heart">❤️</span> برای رضا تاج و بابک
</footer>

<!-- ===== دکمه برو بالا ===== -->
<button class="back-to-top" id="backToTop">↑</button>

<div class="lightbox" id="lightbox">
  <button class="close" id="closeLb">×</button>
  <button class="nav prev" id="prevBtn">‹</button>
  <div class="lb-content">
    <img id="lbImg" src="" alt="">
    <div class="lb-caption">
      <div class="lb-title" id="lbTitle"></div>
      <div class="lb-desc" id="lbDesc"></div>
    </div>
  </div>
  <button class="nav next" id="nextBtn">›</button>
</div>

<script>
// ============================================
// لیست عکس‌ها
// ============================================
const PHOTOS = [
  { file: '2.jpg', title: 'عکس یادگاری', desc: 'عکس‌های یادگاری رضا تاج و بابک' },
  { file: '3.jpg', title: 'عکس یادگاری', desc: 'عکس‌های یادگاری رضا تاج و بابک' },
  { file: '4.jpg', title: 'عکس یادگاری', desc: 'عکس‌های یادگاری رضا تاج و بابک' },
  { file: '6.jpg', title: 'عکس یادگاری', desc: 'عکس‌های یادگاری رضا تاج و بابک' },
  { file: '7.jpg', title: 'عکس یادگاری', desc: 'عکس‌های یادگاری رضا تاج و بابک' },
  { file: '8.jpg', title: 'عکس یادگاری', desc: 'عکس‌های یادگاری رضا تاج و بابک' },
  { file: '27.jpg', title: 'عکس یادگاری', desc: 'عکس‌های یادگاری رضا تاج و بابک' },
  { file: '49.jpg', title: 'عکس یادگاری', desc: 'عکس‌های یادگاری رضا تاج و بابک' },
];

const BASE_URL = 'https://babakkaba9-sudo.github.io/Loplop/';

// ============================================
let photos = [];
let searchTerm = '';
let lbIndex = 0;

const gallery = document.getElementById('gallery');
const lightbox = document.getElementById('lightbox');
const lbImg = document.getElementById('lbImg');
const lbTitle = document.getElementById('lbTitle');
const lbDesc = document.getElementById('lbDesc');

// ============================================
function loadPhotos() {
  photos = PHOTOS.map((p, i) => ({
    id: i,
    url: BASE_URL + p.file,
    title: p.title,
    desc: p.desc
  }));
  render();
}

// ============================================
function render() {
  let filtered = photos.filter(p => {
    return (p.title + ' ' + p.desc).toLowerCase().includes(searchTerm.toLowerCase());
  });

  if (filtered.length === 0) {
    gallery.innerHTML = `
      <div class="empty">
        <h3>عکسی پیدا نشد</h3>
        <p>عبارت دیگه‌ای جستجو کن</p>
      </div>`;
    return;
  }

  gallery.innerHTML = '';
  filtered.forEach((p, idx) => {
    const card = document.createElement('div');
    card.className = 'photo-card';
    card.style.animationDelay = (idx * 0.08) + 's';
    card.innerHTML = `
      <img src="${p.url}" alt="${p.title}" loading="lazy">
      <div class="photo-info">
        <div class="title">${p.title}</div>
        <div class="desc"><span class="heart">❤️</span> ${p.desc}</div>
      </div>
    `;
    card.onclick = () => openLightbox(p.id);
    gallery.appendChild(card);
  });
}

// ============================================
document.getElementById('searchBox').addEventListener('input', e => {
  searchTerm = e.target.value;
  render();
});

// ============================================
function openLightbox(id) {
  lbIndex = photos.findIndex(p => p.id === id);
  if (lbIndex < 0) return;
  const p = photos[lbIndex];
  lbImg.src = p.url;
  lbTitle.textContent = p.title;
  lbDesc.textContent = p.desc;
  lightbox.classList.add('active');
}
function closeLightbox() { lightbox.classList.remove('active'); }
function navLightbox(dir) {
  lbIndex = (lbIndex + dir + photos.length) % photos.length;
  const p = photos[lbIndex];
  lbImg.src = p.url;
  lbTitle.textContent = p.title;
  lbDesc.textContent = p.desc;
}
document.getElementById('closeLb').onclick = closeLightbox;
document.getElementById('prevBtn').onclick = () => navLightbox(-1);
document.getElementById('nextBtn').onclick = () => navLightbox(1);
lightbox.onclick = e => { if (e.target === lightbox) closeLightbox(); };

document.addEventListener('keydown', e => {
  if (!lightbox.classList.contains('active')) return;
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowRight') navLightbox(-1);
  if (e.key === 'ArrowLeft') navLightbox(1);
});

// ============================================
// دکمه برو بالا
// ============================================
const backToTop = document.getElementById('backToTop');
window.addEventListener('scroll', () => {
  if (window.scrollY > 300) {
    backToTop.classList.add('show');
  } else {
    backToTop.classList.remove('show');
  }
});
backToTop.onclick = () => {
  window.scrollTo({ top: 0, behavior: 'smooth' });
};

// ============================================
loadPhotos();
</script>
</body>
</html>
