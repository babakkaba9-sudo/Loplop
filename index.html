<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عکس‌های یادگاری رضا تاج و بابک</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: Tahoma, sans-serif;
    background: #0f0f13;
    color: #fff;
    min-height: 100vh;
  }
  header {
    background: linear-gradient(135deg, #667eea, #764ba2);
    padding: 25px 20px;
    text-align: center;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  header h1 { font-size: 1.8rem; margin-bottom: 5px; }
  header .subtitle {
    font-size: 1rem;
    opacity: 0.9;
    margin-top: 5px;
  }
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    align-items: center;
    max-width: 1200px;
    margin: 15px auto 0;
  }
  .toolbar input[type="text"] {
    padding: 10px 15px;
    border-radius: 25px;
    border: none;
    outline: none;
    font-family: inherit;
    width: 220px;
    background: rgba(255,255,255,0.9);
  }
  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
    max-width: 1200px;
    margin: 0 auto;
    padding: 30px 20px 40px;
  }
  .photo-card {
    position: relative;
    overflow: hidden;
    border-radius: 12px;
    cursor: pointer;
    background: #1a1a22;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    transition: transform 0.3s;
  }
  .photo-card:hover { transform: translateY(-5px); }
  .photo-card img {
    width: 100%;
    height: 280px;
    object-fit: cover;
    display: block;
    transition: transform 0.4s;
  }
  .photo-card:hover img { transform: scale(1.08); }
  .photo-info {
    padding: 15px 15px 18px;
    background: #1a1a22;
    border-top: 1px solid #2a2a33;
  }
  .photo-info .title {
    font-size: 1rem;
    font-weight: bold;
    margin-bottom: 8px;
    color: #fff;
  }
  .photo-info .desc {
    font-size: 0.9rem;
    color: #aaa;
    line-height: 1.6;
  }
  .photo-info .desc .heart {
    color: #ff6b9d;
  }
  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.95);
    z-index: 1000;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  .lightbox.active { display: flex; }
  .lightbox .lb-content {
    max-width: 90%;
    max-height: 90vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .lightbox img {
    max-width: 100%;
    max-height: 75vh;
    border-radius: 10px;
    box-shadow: 0 0 40px rgba(255,255,255,0.2);
  }
  .lightbox .lb-caption {
    margin-top: 15px;
    text-align: center;
    color: #fff;
  }
  .lightbox .lb-caption .lb-title {
    font-size: 1.1rem;
    font-weight: bold;
    margin-bottom: 8px;
  }
  .lightbox .lb-caption .lb-desc {
    font-size: 0.95rem;
    color: #bbb;
  }
  .lightbox .close {
    position: absolute;
    top: 20px; right: 25px;
    font-size: 2.5rem;
    color: #fff;
    cursor: pointer;
    background: none;
    border: none;
  }
  .lightbox .nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    font-size: 2.5rem;
    color: #fff;
    background: rgba(255,255,255,0.15);
    border: none;
    width: 55px; height: 55px;
    border-radius: 50%;
    cursor: pointer;
    transition: 0.3s;
  }
  .lightbox .nav:hover { background: #667eea; }
  .lightbox .prev { left: 20px; }
  .lightbox .next { right: 20px; }
  .empty {
    text-align: center;
    padding: 60px 20px;
    color: #888;
    grid-column: 1 / -1;
  }
  .empty h3 { font-size: 1.5rem; margin-bottom: 10px; }
 /* ===== پلیر آهنگ ===== */
.music-player {
  max-width: 600px;
  margin: 25px auto 10px;
  padding: 18px 22px;
  background: linear-gradient(135deg, #1a1a2e, #16213e);
  border: 1px solid #2a2a45;
  border-radius: 15px;
  display: flex;
  align-items: center;
  gap: 15px;
  flex-wrap: wrap;
  box-shadow: 0 6px 25px rgba(102, 126, 234, 0.25);
}
.music-icon {
  font-size: 1.8rem;
  animation: pulse 1.8s infinite;
}
@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.15); }
}
.music-info {
  flex: 1;
  min-width: 150px;
}
.music-title {
  font-size: 0.95rem;
  font-weight: bold;
  color: #fff;
  margin-bottom: 5px;
}
.music-player audio {
  width: 100%;
  margin-top: 8px;
  border-radius: 30px;
  outline: none;
}
@media (max-width: 600px) {
  .music-player {
    margin: 15px 12px;
    padding: 14px;
  }
  .music-icon { font-size: 1.4rem; }
}
  footer {
    text-align: center;
    padding: 20px;
    color: #666;
    font-size: 0.9rem;
  }
  @media (max-width: 600px) {
    header h1 { font-size: 1.3rem; }
    .toolbar input[type="text"] { width: 100%; }
    .gallery { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
    .photo-card img { height: 220px; }
    .lightbox .nav { width: 45px; height: 45px; font-size: 1.8rem; }
  }
</style>
</head>
<body>

<header>
  <h1>📸 عکس‌های یادگاری</h1>
  <div class="subtitle">رضا تاج و بابک</div>
  <div class="toolbar">
    <input type="text" id="searchBox" placeholder="🔍 جستجو در توضیحات...">
  </div>
</header>

<!-- ===== پلیر آهنگ ===== -->
<div class="music-player">
  <div class="music-icon">🎵</div>
  <div class="music-info">
    <div class="music-title">مصطفی ابراهیمی - مثل تمام عالم</div>
  </div>
  <audio id="myAudio" controls>
    <source src="song1.mp3" type="audio/mpeg">
    مرورگر شما از پخش صدا پشتیبانی نمی‌کند.
  </audio>
</div>
<div class="gallery" id="gallery">
  <div class="empty">
    <h3>در حال بارگذاری...</h3>
  </div>
</div>

<footer>
  ساخته‌شده با ❤️ برای رضا تاج و بابک
</footer>

<div class="lightbox" id="lightbox">
  <button class="close" id="closeLb">×</button>
  <button class="nav prev" id="prevBtn">‹</button>
  <div class="lb-content">
    <img id="lbImg" src="" alt="">
    <div class="lb-caption">
      <div class="lb-title" id="lbTitle"></div>
      <div class="lb-desc" id="lbDesc"></div>
    </div>
  </div>
  <button class="nav next" id="nextBtn">›</button>
</div>

<script>
// ============================================
// لیست عکس‌ها
// ============================================
const PHOTOS = [
  { file: '2.jpg', title: 'عکس یادگاری', desc: 'عکس‌های یادگاری رضا تاج و بابک' },
  { file: '3.jpg', title: 'عکس یادگاری', desc: 'عکس‌های یادگاری رضا تاج و بابک' },
  { file: '4.jpg', title: 'عکس یادگاری', desc: 'عکس‌های یادگاری رضا تاج و بابک' },
  { file: '6.jpg', title: 'عکس یادگاری', desc: 'عکس‌های یادگاری رضا تاج و بابک' },
  { file: '7.jpg', title: 'عکس یادگاری', desc: 'عکس‌های یادگاری رضا تاج و بابک' },
  { file: '8.jpg', title: 'عکس یادگاری', desc: 'عکس‌های یادگاری رضا تاج و بابک' },
 { file: '27.jpg', title: 'عکس یادگاری', desc: 'عکس‌ بابک' },
{ file: '49.jpg', title: 'عکس یادگاری', desc: 'بابک' },
];

const BASE_URL = 'https://babakkaba9-sudo.github.io/Loplop/';

// ============================================
let photos = [];
let searchTerm = '';
let lbIndex = 0;

const gallery = document.getElementById('gallery');
const lightbox = document.getElementById('lightbox');
const lbImg = document.getElementById('lbImg');
const lbTitle = document.getElementById('lbTitle');
const lbDesc = document.getElementById('lbDesc');

// ============================================
function loadPhotos() {
  photos = PHOTOS.map((p, i) => ({
    id: i,
    url: BASE_URL + p.file,
    title: p.title,
    desc: p.desc
  }));
  render();
}

// ============================================
function render() {
  let filtered = photos.filter(p => {
    return (p.title + ' ' + p.desc).toLowerCase().includes(searchTerm.toLowerCase());
  });

  if (filtered.length === 0) {
    gallery.innerHTML = `
      <div class="empty">
        <h3>عکسی پیدا نشد</h3>
        <p>عبارت دیگه‌ای جستجو کن</p>
      </div>`;
    return;
  }

  gallery.innerHTML = '';
  filtered.forEach(p => {
    const card = document.createElement('div');
    card.className = 'photo-card';
    card.innerHTML = `
      <img src="${p.url}" alt="${p.title}" loading="lazy">
      <div class="photo-info">
        <div class="title">${p.title}</div>
        <div class="desc"><span class="heart">❤️</span> ${p.desc}</div>
      </div>
    `;
    card.onclick = () => openLightbox(p.id);
    gallery.appendChild(card);
  });
}

// ============================================
document.getElementById('searchBox').addEventListener('input', e => {
  searchTerm = e.target.value;
  render();
});

// ============================================
function openLightbox(id) {
  lbIndex = photos.findIndex(p => p.id === id);
  if (lbIndex < 0) return;
  const p = photos[lbIndex];
  lbImg.src = p.url;
  lbTitle.textContent = p.title;
  lbDesc.textContent = p.desc;
  lightbox.classList.add('active');
}
function closeLightbox() { lightbox.classList.remove('active'); }
function navLightbox(dir) {
  lbIndex = (lbIndex + dir + photos.length) % photos.length;
  const p = photos[lbIndex];
  lbImg.src = p.url;
  lbTitle.textContent = p.title;
  lbDesc.textContent = p.desc;
}
document.getElementById('closeLb').onclick = closeLightbox;
document.getElementById('prevBtn').onclick = () => navLightbox(-1);
document.getElementById('nextBtn').onclick = () => navLightbox(1);
lightbox.onclick = e => { if (e.target === lightbox) closeLightbox(); };

document.addEventListener('keydown', e => {
  if (!lightbox.classList.contains('active')) return;
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowRight') navLightbox(-1);
  if (e.key === 'ArrowLeft') navLightbox(1);
});

// ============================================
loadPhotos();
</script>
</body>
</html>
